<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>谍网 SPYNET — 预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #050807;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      background: #050807;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  // 游戏内部逻辑分辨率固定，外层按视口等比缩放居中
  var VIEW_W = 390;
  var VIEW_H = 844;
  var canvas = document.getElementById('c');
  canvas.width = VIEW_W;
  canvas.height = VIEW_H;

  window.wx = {
    createCanvas: function () { return canvas; },
    getSystemInfoSync: function () {
      return { windowWidth: VIEW_W, windowHeight: VIEW_H, pixelRatio: 1 };
    },
    onTouchStart: function () {},
    onTouchEnd: function () {},
    onShow: function () {},
    onHide: function () {}
  };
})();
</script>
<script src="preview-modules.js?v=3"></script>
<script>
(function () {
  var VIEW_W = 390;
  var VIEW_H = 844;
  var scenes = window.__spyNetRequire('./js/scenes');
  var createGame = scenes.createGame;
  var AssetStore = scenes.AssetStore || window.__spyNetRequire('./js/assets').AssetStore;
  var canvas = document.getElementById('c');
  var assets = new AssetStore();
  var game = createGame(canvas, canvas.width, canvas.height, assets);
  window.__spyNetGame = game;

  // 视口等比缩放：保持 390:844 比例，居中显示，任何窗口/手机都自适应
  function fit() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var scale = Math.min(vw / VIEW_W, vh / VIEW_H);
    canvas.style.width = Math.floor(VIEW_W * scale) + 'px';
    canvas.style.height = Math.floor(VIEW_H * scale) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  // 触摸/点击坐标按实际缩放比例换算回游戏坐标
  function handle(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var x = (clientX - rect.left) * (canvas.width / rect.width);
    var y = (clientY - rect.top) * (canvas.height / rect.height);
    game.onTouchStart(x, y);
  }

  canvas.addEventListener('mousedown', function (e) {
    handle(e.clientX, e.clientY);
  });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.touches[0];
    if (t) handle(t.clientX, t.clientY);
  }, { passive: false });

  game.start();
  assets.load('assets/');
  try { game.state.audio.load('assets/audio/'); } catch (e) {}
  game._internal.skipBoot();

  var params = new URLSearchParams(window.location.search);
  var demo = params.get('demo');
  if (demo === 'game' || demo === 'play') {
    game._internal.startGame(params.get('mode') || 'solo');
  }
  if (demo === 'mode') {
    game.state.scene = 'mode';
  }
  if (demo === 'play') {
    var n = 0;
    function tick() {
      if (n >= 3) return;
      var st = game.state;
      if (st.scene === 'game' && st.game && st.game.phase === 'select' && !st.game.player.played) {
        var hand = st.game.player.hand;
        if (hand.length) {
          st.selectedUid = hand[0].uid;
          game._internal.tryPlaySelected();
          n += 1;
        }
      }
      setTimeout(tick, 2200);
    }
    setTimeout(tick, 1000);
  }
})();
</script>
</body>
</html>
